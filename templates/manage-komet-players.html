<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Komet Players</title>
    <link rel="stylesheet" href="/static/design-system.css">
</head>
<body>
    <div class="page">
    <div class="topbar">
        <span id="admin-header-name" style="font-weight:600"></span>
        <button onclick="window.location.href='/'" class="btn btn--secondary">Logout</button>
    </div>
    <nav class="admin-nav">
        <a href="/">Tournaments for Registration</a>
        <a href="/add-remove-tournaments.html">Add/Remove</a>
        <a href="/results.html">Previous Tournaments</a>
        <a href="/send-email.html">Send Email</a>
        <a href="/manage.html">Manage</a>
    </nav>
    <script>
        fetch("/api/bwf-status").then(r=>r.json()).then(d=>{
            const el = document.getElementById("admin-header-name");
            if(el && d.logged_in) el.textContent = "Admin: " + d.player_name;
            if(!d.is_admin) window.location.href = "/";
        });
        document.querySelector('[onclick*="location"]').onclick = async () => {
            await fetch("/api/bwf-logout", {method:"POST"});
            window.location.href = "/";
        };
    </script>

    <h1 class="page-title">Manage Komet Players</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('players')">Add Players</button>
        <button class="tab-btn" onclick="switchTab('groups')">Add Groups</button>
    </div>

    <!-- Tab 1: Add Players -->
    <div id="players-tab" class="tab-content active">
        <div class="stack">
            <form id="player-form" class="card">
                <div class="card__body">
                    <h3 id="form-title" class="card-title">Add Player</h3>
                    <div class="field search-anchor">
                        <label class="field__label" for="player-name">Name</label>
                        <input type="text" id="player-name" placeholder="Search player..." autocomplete="off" required>
                        <div id="name-search-results" class="search-results" style="display:none;"></div>
                    </div>
                    <div class="field">
                        <label class="field__label" for="player-license">License ID</label>
                        <input type="text" id="player-license" placeholder="Auto-filled from search" readonly>
                    </div>
                    <div class="field">
                        <label class="field__label" for="player-email">Email</label>
                        <input type="email" id="player-email" placeholder="email@example.com">
                    </div>
                    <div class="field">
                        <label class="field__label" for="player-secondary-email">Secondary Email</label>
                        <input type="email" id="player-secondary-email" placeholder="secondary@example.com">
                    </div>
                    <div class="field">
                        <label class="field__label">Groups</label>
                        <div id="groups-checkboxes" style="display:flex;flex-wrap:wrap;gap:var(--sp-2);"></div>
                    </div>
                    <input type="hidden" id="edit-id" value="">
                    <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;">
                        <button type="submit" class="btn">Save</button>
                        <button type="button" onclick="cancelEdit()" class="btn btn--secondary" style="display:none;" id="cancel-btn">Cancel</button>
                    </div>
                </div>
            </form>

            <div class="stack">
                <div style="display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;">
                    <label for="search-input" class="sr-only">Search players</label>
                    <input type="text" id="search-input" placeholder="Search by name, license ID, or email..." autocomplete="off" style="flex:1;">
                    <label for="group-filter" class="sr-only">Filter by group</label>
                    <select id="group-filter" onchange="applyFilter()" style="width:auto;">
                        <option value="">All Groups</option>
                    </select>
                    <button onclick="syncFromPlayers()" class="btn btn--secondary">Sync from Players DB</button>
                </div>
                <p id="sync-status" class="banner" style="display:none;"></p>
                <p id="player-count" class="muted"></p>
                <div id="players-list"></div>
                <div id="pagination" style="display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;"></div>
            </div>
        </div>
    </div>

    <!-- Tab 2: Add Groups -->
    <div id="groups-tab" class="tab-content">
        <div class="stack">
            <div>
                <h3 class="card-title">Create Player Groups</h3>
                <p class="muted">Groups are used to categorize players (e.g. U13, U15, Parents, Board).</p>
                <form id="group-form" style="display:flex;gap:var(--sp-2);flex-wrap:wrap;">
                    <input type="text" id="new-group-name" placeholder="Group name (e.g. U13, Parents)" required style="flex:1;">
                    <button type="submit" class="btn">Add Group</button>
                </form>
            </div>

            <div>
                <h3 class="card-title">Existing Groups</h3>
                <div id="groups-list"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 30;
        let allGroups = [];

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            document.querySelectorAll('.tab-btn')[tab === 'players' ? 0 : 1].classList.add('active');
            if (tab === 'groups') loadGroupsList();
        }

        // === Groups Management ===
        async function loadGroups() {
            const res = await fetch("/api/player-groups");
            const data = await res.json();
            allGroups = data.success ? data.groups : [];
            renderGroupCheckboxes();
        }

        function renderGroupCheckboxes(selectedGroups = []) {
            const container = document.getElementById("groups-checkboxes");
            if (!allGroups.length) {
                container.innerHTML = '<span class="muted">No groups yet. Create one in the Groups tab.</span>';
                return;
            }
            container.innerHTML = allGroups.map(g => {
                const checked = selectedGroups.includes(g.group_name);
                return `
                <label class="check-row">
                    <input type="checkbox" class="group-checkbox" value="${g.group_name}" ${checked ? 'checked' : ''}>
                    ${g.group_name}
                </label>`;
            }).join("");
        }

        function getSelectedGroups() {
            return Array.from(document.querySelectorAll(".group-checkbox:checked")).map(cb => cb.value);
        }

        async function loadGroupsList() {
            await loadGroups();
            const container = document.getElementById("groups-list");
            if (!allGroups.length) {
                container.innerHTML = '<p class="muted">No groups yet.</p>';
                return;
            }
            container.innerHTML = `<table class="table table--stack">
                <thead><tr><th>Group Name</th><th>Actions</th></tr></thead>
                <tbody>` +
                allGroups.map(g => `
                    <tr>
                        <td data-label="Group Name">${g.group_name}</td>
                        <td data-label="Actions"><button onclick="deleteGroup(${g.id}, '${g.group_name.replace(/'/g,"\\'")}')" class="btn btn--danger">Delete</button></td>
                    </tr>
                `).join("") +
                `</tbody></table>`;
        }

        document.getElementById("group-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("new-group-name").value.trim();
            if (!name) return;
            const res = await fetch("/api/player-groups", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({group_name: name})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById("new-group-name").value = "";
                loadGroupsList();
                loadGroups(); // Refresh checkboxes in players tab
            } else {
                alert(data.error || "Failed to add group");
            }
        });

        async function deleteGroup(id, name) {
            if (!confirm(`Delete group "${name}"?`)) return;
            const res = await fetch(`/api/player-groups/${id}`, {method: "DELETE"});
            const data = await res.json();
            if (data.success) { loadGroupsList(); loadGroups(); }
            else alert(data.error || "Failed to delete");
        }

        // === Players Management ===
        async function syncFromPlayers() {
            const statusEl = document.getElementById("sync-status");
            statusEl.style.display = "block";
            statusEl.className = "banner";
            statusEl.textContent = "Syncing Komet players from players database...";

            try {
                const res = await fetch("/api/komet-players/sync", {method: "POST"});
                const data = await res.json();
                if (data.success) {
                    statusEl.className = "banner banner--ok";
                    statusEl.textContent = `Success: ${data.message}`;
                    loadPlayers();
                } else {
                    statusEl.className = "banner banner--bad";
                    statusEl.textContent = `Error: ${data.error}`;
                }
            } catch(e) {
                statusEl.className = "banner banner--bad";
                statusEl.textContent = `Error: ${e.message}`;
            }
            setTimeout(() => { statusEl.style.display = "none"; }, 5000);
        }

        async function loadPlayers(page = 1, search = "") {
            currentPage = page;
            const container = document.getElementById("players-list");
            const groupFilter = document.getElementById("group-filter").value;

            let url = `/api/komet-players?page=${page}&pageSize=${pageSize}`;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (groupFilter) url += `&group=${encodeURIComponent(groupFilter)}`;

            const res = await fetch(url);
            const data = await res.json();

            if (!data.success) {
                container.innerHTML = `<p class="banner banner--bad">${data.error || 'Failed to load'}</p>`;
                return;
            }

            document.getElementById("player-count").textContent = `${data.total} player${data.total !== 1 ? 's' : ''} total`;

            if (!data.players.length) {
                container.innerHTML = '<p class="muted">No players found.</p>';
                document.getElementById("pagination").innerHTML = "";
                return;
            }

            container.innerHTML = `
                <table class="table table--stack">
                    <thead>
                        <tr><th>Name</th><th>License ID</th><th>Email</th><th>Groups</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${data.players.map(p => {
                            let groups = [];
                            try { groups = p.groups ? JSON.parse(p.groups) : []; } catch(e) {}
                            const groupTags = groups.map(g => `<span class="badge badge--neutral">${g}</span>`).join("");
                            const secondaryEmail = p.secondary_email ? `<br><span class="muted">${p.secondary_email}</span>` : "";
                            return `
                            <tr>
                                <td data-label="Name">${p.name}</td>
                                <td data-label="License ID">${p.license_id || ""}</td>
                                <td data-label="Email">${p.email || ""}${secondaryEmail}</td>
                                <td data-label="Groups">${groupTags}</td>
                                <td data-label="Actions">
                                    <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;">
                                        <button onclick='editPlayer(${JSON.stringify(p)})' class="btn btn--secondary">Edit</button>
                                        <button onclick="deletePlayer(${p.id}, '${(p.name||'').replace(/'/g,"\\'")}')" class="btn btn--danger">Delete</button>
                                    </div>
                                </td>
                            </tr>`;
                        }).join("")}
                    </tbody>
                </table>
            `;

            const totalPages = Math.ceil(data.total / pageSize);
            let pagHtml = `<span class="muted">Page ${page} of ${totalPages}</span>`;
            if (page > 1) pagHtml += `<button onclick="loadPlayers(${page-1}, document.getElementById('search-input').value)" class="btn btn--secondary">← Prev</button>`;
            if (page < totalPages) pagHtml += `<button onclick="loadPlayers(${page+1}, document.getElementById('search-input').value)" class="btn btn--secondary">Next →</button>`;
            document.getElementById("pagination").innerHTML = pagHtml;
        }

        // Add/Edit form
        document.getElementById("player-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("edit-id").value;
            const selectedGroups = getSelectedGroups();
            const playerData = {
                license_id: document.getElementById("player-license").value.trim(),
                name: document.getElementById("player-name").value.trim(),
                email: document.getElementById("player-email").value.trim(),
                secondary_email: document.getElementById("player-secondary-email").value.trim(),
                groups: selectedGroups.join(", ")
            };

            let res;
            if (editId) {
                res = await fetch(`/api/komet-players/${editId}`, {
                    method: "PUT",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(playerData)
                });
            } else {
                res = await fetch("/api/komet-players", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(playerData)
                });
            }
            const data = await res.json();
            if (data.success) {
                cancelEdit();
                loadPlayers(currentPage, document.getElementById("search-input").value);
            } else {
                alert(data.error || "Failed to save");
            }
        });

        function editPlayer(p) {
            let groups = [];
            try { groups = p.groups ? JSON.parse(p.groups) : []; } catch(e) {}

            document.getElementById("edit-id").value = p.id;
            document.getElementById("player-license").value = p.license_id || "";
            document.getElementById("player-license").readOnly = false;
            document.getElementById("player-name").value = p.name || "";
            document.getElementById("player-email").value = p.email || "";
            document.getElementById("player-secondary-email").value = p.secondary_email || "";
            renderGroupCheckboxes(groups);
            document.getElementById("form-title").textContent = "Edit Player";
            document.getElementById("cancel-btn").style.display = "inline-block";
            document.getElementById("player-form").scrollIntoView({behavior: "smooth"});
        }

        function cancelEdit() {
            document.getElementById("player-form").reset();
            document.getElementById("edit-id").value = "";
            document.getElementById("player-license").readOnly = true;
            document.getElementById("form-title").textContent = "Add Player";
            document.getElementById("cancel-btn").style.display = "none";
            renderGroupCheckboxes([]);
        }

        async function deletePlayer(id, name) {
            if (!confirm(`Delete ${name} from Komet players?`)) return;
            const res = await fetch(`/api/komet-players/${id}`, {method: "DELETE"});
            const data = await res.json();
            if (data.success) loadPlayers(currentPage, document.getElementById("search-input").value);
            else alert(data.error || "Failed to delete");
        }

        // Live search on name field
        let nameSearchTimeout;
        const nameInput = document.getElementById("player-name");
        const nameResults = document.getElementById("name-search-results");

        nameInput.addEventListener("input", (e) => {
            clearTimeout(nameSearchTimeout);
            const q = e.target.value.trim();
            if (q.length < 2) { nameResults.style.display = "none"; return; }
            nameSearchTimeout = setTimeout(async () => {
                const res = await fetch(`/api/search-players?q=${encodeURIComponent(q)}`);
                const players = await res.json();
                if (!players.length) { nameResults.style.display = "none"; return; }
                nameResults.innerHTML = players.map((p, i) =>
                    `<div class="search-item" data-index="${i}">
                        <strong>${p.name}</strong>${p.license_id ? ' (' + p.license_id + ')' : ''}<br>
                        <span class="muted">${p.club || 'No club'}</span>
                    </div>`
                ).join("");
                nameResults.style.display = "block";
                nameResults.querySelectorAll(".search-item").forEach((el, idx) => {
                    el.addEventListener("click", () => {
                        document.getElementById("player-name").value = players[idx].name || "";
                        document.getElementById("player-license").value = players[idx].license_id || "";
                        nameResults.style.display = "none";
                    });
                });
            }, 300);
        });

        document.addEventListener("click", (e) => {
            if (!nameInput.contains(e.target) && !nameResults.contains(e.target))
                nameResults.style.display = "none";
        });

        // Search players list
        let searchTimeout;
        document.getElementById("search-input").addEventListener("input", (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadPlayers(1, e.target.value.trim()), 300);
        });

        function applyFilter() {
            const search = document.getElementById("search-input").value.trim();
            loadPlayers(1, search);
        }

        async function populateGroupFilter() {
            const res = await fetch("/api/player-groups");
            const data = await res.json();
            const select = document.getElementById("group-filter");
            select.innerHTML = '<option value="">All Groups</option><option value="__none__">No Group Assigned</option>';
            if (data.success && data.groups) {
                data.groups.filter(g => g.group_name !== "All").forEach(g => {
                    select.innerHTML += `<option value="${g.group_name}">${g.group_name}</option>`;
                });
            }
        }

        // Init
        loadGroups();
        populateGroupFilter();
        loadPlayers();
    </script>
    </div>

    <footer class="site-footer">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se">support@bmkkomet.se</a></p>
    </footer>
<script src="/static/devbar.js"></script>
</body>
</html>
