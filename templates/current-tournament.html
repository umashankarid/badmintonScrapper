<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Tournament</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .ct-card { border:1px solid #e0e0e0; border-radius:10px; padding:15px; margin-bottom:10px; background:#fff; box-shadow:0 2px 10px rgba(26,35,126,0.06); cursor:pointer; transition:transform .15s, box-shadow .15s; }
        .ct-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(13,71,161,0.15); }
        .ct-card h3 { margin:0 0 5px; color:#0d47a1; }
        .ct-card p { margin:2px 0; color:#666; font-size:0.9em; }
    </style>
</head>
<body>
    <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:5px;gap:10px;">
        <span style="font-weight:bold;font-size:0.9em;color:#333;" id="admin-header-name"></span>
        <button id="logout-btn" style="width:auto;padding:6px 14px;background:#666;font-size:0.85em;border:none;border-radius:4px;color:white;cursor:pointer;">Logout</button>
    </div>
    <nav style="display:flex;border-bottom:2px solid #e0e0e0;gap:0;margin-bottom:20px;flex-wrap:wrap;">
        <a href="/" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Tournaments for Registration</a>
        <a href="/current-tournament.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:600;color:#0d47a1;border-bottom:3px solid #0d47a1;margin-bottom:-2px;">Current Tournament</a>
        <a href="/results.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Previous Tournaments</a>
        <a href="/manage.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Manage</a>
    </nav>

    <h1>🏸 Current Tournament</h1>
    <p style="color:#666;">Tävlingar som pågår idag / Tournaments happening today. Klicka för detaljer.</p>

    <div id="today-list"><p id="loading-today">Loading today's tournaments...</p></div>

    <script>
        fetch("/api/bwf-status").then(r=>r.json()).then(d=>{
            const el = document.getElementById("admin-header-name");
            if (el && d.logged_in) el.textContent = (d.is_admin ? "Admin: " : "") + d.player_name;
        });
        document.getElementById("logout-btn").onclick = async () => {
            await fetch("/api/bwf-logout", {method:"POST"});
            window.location.href = "/";
        };

        async function loadToday() {
            const res = await fetch("/api/current-tournaments");
            const data = await res.json();
            const list = document.getElementById("today-list");
            if (!data.success || !data.tournaments.length) {
                list.innerHTML = '<p style="color:#666;">Inga tävlingar pågår idag. / No tournaments happening today.</p>';
                return;
            }
            list.innerHTML = data.tournaments.map(function(t) {
                if (!t.tournament_id) {
                    return '<div class="ct-card" style="cursor:default;opacity:0.7;">' +
                        '<h3>' + t.name + '</h3>' +
                        '<p>📍 ' + (t.location||'') + '</p>' +
                        '<p style="color:#c62828;">No live data link available for this tournament.</p></div>';
                }
                var href = '/tournament-live.html?id=' + encodeURIComponent(t.tournament_id) +
                           '&name=' + encodeURIComponent(t.name || '') +
                           '&info=' + encodeURIComponent((t.location||'') + ' · ' + t.date_start + (t.date_end && t.date_end!==t.date_start ? ' → ' + t.date_end : ''));
                return '<div class="ct-card" onclick="window.location.href=\'' + href + '\'">' +
                    '<h3>' + t.name + '</h3>' +
                    '<p>📍 ' + (t.location||'') + '</p>' +
                    '<p>📅 ' + t.date_start + (t.date_end && t.date_end!==t.date_start ? ' → ' + t.date_end : '') + '</p>' +
                    '<p style="color:#0d47a1;font-weight:600;">View players & matches →</p></div>';
            }).join("");
        }
        loadToday();
    </script>

    <footer style="margin-top:40px;padding:20px;text-align:center;border-top:1px solid #e0e0e0;color:#666;font-size:0.85em;">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se" style="color:#0d47a1;">support@bmkkomet.se</a></p>
    </footer>
</body>
</html>
