<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .filterbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; }
        .rangebtn { width:auto; margin:0; padding:8px 14px; font-size:0.85em; background:#eef2f7; color:#0d47a1; box-shadow:none; }
        .rangebtn.active { background:#0d47a1; color:#fff; }
        .t-card { border:1px solid #e0e0e0; border-radius:10px; padding:14px; margin-bottom:10px; background:#fff; cursor:pointer; transition:transform .15s, box-shadow .15s; }
        .t-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(13,71,161,0.15); }
        .t-card h3 { margin:0 0 4px; color:#0d47a1; }
        .t-card p { margin:2px 0; color:#666; font-size:0.9em; }

        /* radiator board */
        .board { display:flex; gap:14px; overflow-x:auto; padding-bottom:12px; align-items:flex-start; }
        .pcol { flex:0 0 300px; background:#fff; border:1px solid #e0e0e0; border-radius:12px; box-shadow:0 2px 10px rgba(26,35,126,0.06); display:flex; flex-direction:column; max-height:78vh; }
        .pcol__head { padding:12px 14px; border-bottom:2px solid #0d47a1; position:sticky; top:0; background:#f7faff; border-radius:12px 12px 0 0; }
        .pcol__head h3 { margin:0; color:#0d47a1; font-size:1.05em; }
        .pcol__head .club { color:#888; font-size:0.78em; }
        .pcol__body { padding:10px 12px; overflow-y:auto; }
        .sect-label { font-size:0.72em; text-transform:uppercase; letter-spacing:.04em; color:#888; margin:10px 0 4px; font-weight:700; }
        .m { border:1px solid #eee; border-radius:8px; padding:8px 10px; margin-bottom:7px; font-size:0.86em; }
        .m .ev { color:#555; font-size:0.82em; }
        .m .vs { margin-top:3px; }
        .m .score { font-weight:700; color:#0066cc; margin-top:3px; }
        .m.ongoing { border-left:4px solid #2e7d32; background:#f1f8f2; }
        .m.upcoming { border-left:4px solid #1565c0; background:#f4f8fd; }
        .m.done { border-left:4px solid #bbb; background:#fafafa; }
        .won { font-weight:700; color:#28a745; }
        .lost { color:#888; }
        .court { background:#e8f5e9; color:#1b5e20; border-radius:6px; padding:1px 7px; font-size:0.78em; font-weight:700; }
        .time { background:#ede7f6; color:#4527a0; border-radius:6px; padding:1px 7px; font-size:0.78em; font-weight:600; }
        .byorder { background:#f3e5f5; color:#6a1b9a; border-radius:6px; padding:1px 7px; font-size:0.72em; }
        .badge-done { background:#eee; color:#666; border-radius:6px; padding:1px 7px; font-size:0.72em; font-weight:700; }
        .empty { color:#bbb; font-size:0.82em; font-style:italic; }
        .refresh-note { color:#888; font-size:0.8em; }
        .daybtn { width:auto; margin:0; padding:5px 12px; font-size:0.8em; box-shadow:none; }
    </style>
</head>
<body>
    <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:5px;gap:10px;">
        <span style="font-weight:bold;font-size:0.9em;color:#333;" id="admin-header-name"></span>
        <button id="logout-btn" style="width:auto;padding:6px 14px;background:#666;font-size:0.85em;border:none;border-radius:4px;color:white;cursor:pointer;">Logout</button>
    </div>
    <nav style="display:flex;border-bottom:2px solid #e0e0e0;gap:0;margin-bottom:16px;flex-wrap:wrap;">
        <a href="/" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Tournaments for Registration</a>
        <a href="/current-tournament.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Current Tournament</a>
        <a href="/tournament-dashboard.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:600;color:#0d47a1;border-bottom:3px solid #0d47a1;margin-bottom:-2px;">📺 Tournament Dashboard</a>
        <a href="/results.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Previous Tournaments</a>
        <a href="/manage.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Manage</a>
    </nav>

    <!-- FILTER VIEW -->
    <div id="filter-view">
        <h1 style="margin:4px 0;">📺 Tournament Dashboard</h1>
        <p style="color:#666;margin:2px 0 0;">Välj tidsintervall och tävling / Pick a date range and a tournament.</p>
        <div class="filterbar" id="rangebar">
            <button class="rangebtn" data-range="today">Today</button>
            <button class="rangebtn active" data-range="this_week">This week</button>
            <button class="rangebtn" data-range="last_week">Last week</button>
            <button class="rangebtn" data-range="this_month">This month</button>
            <button class="rangebtn" data-range="last_month">Last month</button>
        </div>
        <div id="t-list"><p style="color:#666;">Loading...</p></div>
    </div>

    <!-- BOARD VIEW -->
    <div id="board-view" style="display:none;">
        <a href="/tournament-dashboard.html" style="color:#0d47a1;text-decoration:none;">← Back to filter</a>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin:6px 0;">
            <div>
                <h1 id="b-name" style="margin:4px 0 2px;">Loading…</h1>
                <p id="b-info" style="color:#666;margin:0;"></p>
            </div>
            <div style="text-align:right;">
                <div id="day-selector" style="margin-bottom:4px;"></div>
                <span class="refresh-note" id="refresh-note"></span>
            </div>
        </div>
        <div id="board" class="board"></div>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var tournamentId = params.get("id") || "";
        var tournamentName = params.get("name") || "";
        var tournamentInfo = params.get("info") || "";
        var currentRange = "this_week";
        var selectedDay = "";
        var refreshTimer = null;

        fetch("/api/bwf-status").then(function(r){return r.json();}).then(function(d){
            var el = document.getElementById("admin-header-name");
            if (el && d.logged_in) el.textContent = (d.is_admin ? "Admin: " : "") + d.player_name;
            if (!d.is_admin) window.location.href = "/";
        });
        document.getElementById("logout-btn").onclick = async function(){
            await fetch("/api/bwf-logout", {method:"POST"});
            window.location.href = "/";
        };

        function isKometFlag(p) {
            // Prefer the backend's is_komet (club-first + roster fallback); keep a
            // defensive club-string check for older responses.
            if (typeof p.is_komet === "boolean") return p.is_komet;
            return !!(p.club && p.club.toLowerCase().indexOf("komet") !== -1);
        }
        function esc(s) { return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

        // ---------------- FILTER VIEW ----------------
        // Compute [start, end] 'YYYY-MM-DD' for a named range, mirroring the
        // proven Previous-Tournaments filter (results.html). Weeks are Sun-based
        // there (getDay()); we keep that so behaviour matches the tab the user
        // said "works well".
        function rangeDates(range) {
            var now = new Date();
            var start, end;
            switch (range) {
                case "today":
                    start = new Date(now); end = new Date(now); break;
                case "last_week":
                    start = new Date(now); start.setDate(now.getDate() - now.getDay() - 7);
                    end = new Date(start); end.setDate(start.getDate() + 6); break;
                case "this_week":
                    start = new Date(now); start.setDate(now.getDate() - now.getDay());
                    end = new Date(start); end.setDate(start.getDate() + 6); break;
                case "last_month":
                    start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    end = new Date(now.getFullYear(), now.getMonth(), 0); break;
                case "this_month":
                    start = new Date(now.getFullYear(), now.getMonth(), 1);
                    end = new Date(now.getFullYear(), now.getMonth() + 1, 0); break;
                default:
                    start = new Date(now); end = new Date(now);
            }
            function iso(d){ return d.getFullYear() + "-" +
                String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
            return { start: iso(start), end: iso(end) };
        }

        async function loadTournaments(range) {
            currentRange = range;
            document.querySelectorAll(".rangebtn").forEach(function(b){
                b.classList.toggle("active", b.dataset.range === range);
            });
            var box = document.getElementById("t-list");
            box.innerHTML = '<p style="color:#666;">Loading...</p>';
            // Use the SAME live endpoint as the Previous Tournaments tab
            // (/api/search-tournaments), which scrapes Badminton Sweden for the
            // date range and works for any past/future window — it does not
            // depend on what's stored in the local tournaments.db.
            var rd = rangeDates(range);
            var url = "/api/search-tournaments?start=" + encodeURIComponent(rd.start) +
                      "&end=" + encodeURIComponent(rd.end);
            console.log("[dashboard] loadTournaments range=" + range + " ->", url);
            try {
                var res = await fetch(url);
                console.log("[dashboard] response", res.status, res.headers.get("content-type"));
                var raw = await res.text();
                var data;
                try { data = JSON.parse(raw); }
                catch (pe) {
                    console.error("[dashboard] non-JSON response:", raw.slice(0, 500));
                    box.innerHTML = '<p style="color:#c62828;">Server returned a non-JSON response (HTTP ' +
                        res.status + '). First bytes:</p><pre style="white-space:pre-wrap;color:#c62828;">' +
                        esc(raw.slice(0, 300)) + '</pre>';
                    return;
                }
                if (!res.ok || !data.success) {
                    console.error("[dashboard] error payload:", data);
                    box.innerHTML = '<p style="color:#c62828;">HTTP ' + res.status + ' — ' +
                        esc(data.error || "Failed to load") + '</p>';
                    return;
                }
                if (!data.tournaments || !data.tournaments.length) {
                    console.log("[dashboard] 0 tournaments for", range, rd.start, "→", rd.end);
                    box.innerHTML = '<p style="color:#666;">Inga tävlingar i detta intervall (' +
                        esc(rd.start) + ' → ' + esc(rd.end) +
                        '). / No tournaments in this range.</p>';
                    return;
                }
                console.log("[dashboard] rendering", data.tournaments.length, "tournaments");
                box.innerHTML = data.tournaments.map(function(t){
                    var dates = esc(t.date_start) + (t.date_end && t.date_end !== t.date_start ? " → " + esc(t.date_end) : "");
                    // /api/search-tournaments returns the GUID as `id`.
                    var tid = t.id || t.tournament_id || "";
                    if (!tid) {
                        return '<div class="t-card" style="cursor:default;opacity:0.65;"><h3>' + esc(t.name) + '</h3>' +
                               '<p>📍 ' + esc(t.location||"") + '</p><p>📅 ' + dates + '</p>' +
                               '<p style="color:#c62828;">No live data link available.</p></div>';
                    }
                    var href = '/tournament-dashboard.html?id=' + encodeURIComponent(tid) +
                               '&name=' + encodeURIComponent(t.name||"") +
                               '&info=' + encodeURIComponent((t.location||"") + " · " + dates);
                    return '<div class="t-card" onclick="window.location.href=\'' + href + '\'">' +
                           '<h3>' + esc(t.name) + '</h3><p>📍 ' + esc(t.location||"") + '</p>' +
                           '<p>📅 ' + dates + '</p>' + (t.status ? '<p>Status: ' + esc(t.status) + '</p>' : '') +
                           '<p style="color:#0d47a1;font-weight:600;">Open dashboard →</p></div>';
                }).join("");
            } catch (e) {
                console.error("[dashboard] loadTournaments threw:", e);
                box.innerHTML = '<p style="color:#c62828;">Network/JS error: ' + esc(e.message) + '</p>';
            }
        }

        // ---------------- BOARD VIEW ----------------
        function fmtDay(d) { return (d && d.length===8) ? d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8) : (d||""); }

        // Normalize a name for matching: "Lastname, Firstname" -> "firstname
        // lastname", strip "(Komet)" markers and seeding brackets like [1] / [5/8],
        // collapse whitespace. Must mirror the backend _normalize_name_for_match
        // so player-list names ("Lastname, Firstname") match the match team
        // strings ("Firstname Lastname").
        function normName(s) {
            if (!s) return "";
            s = String(s).replace(/\(komet\)/ig, "").replace(/\[[^\]]*\]/g, "");
            s = s.trim();
            if (s.indexOf(",") !== -1) {
                var parts = s.split(",");
                if (parts.length === 2) s = parts[1].trim() + " " + parts[0].trim();
            }
            return s.toLowerCase().replace(/\s+/g, " ").trim();
        }

        function nameInTeam(player, team) {
            if (!team) return false;
            // Prefer the backend-provided normalized name; fall back to normalizing here.
            var target = (player.name_normalized || normName(player.name || "")).trim();
            if (!target) return false;
            // A doubles team is "A / B" — check each side so partners both match.
            var sides = String(team).split("/");
            for (var i = 0; i < sides.length; i++) {
                if (normName(sides[i]) === target) return true;
            }
            // Fallback: substring on the whole normalized team (handles odd separators).
            return normName(team).indexOf(target) !== -1;
        }

        function matchHtml(m) {
            var cls = m.status === "ongoing" ? "ongoing" : (m.status === "upcoming" ? "upcoming" : "done");
            var right = "";
            if (m.status === "ongoing") {
                right = m.court ? '<span class="court">🏟️ ' + esc(m.court) + '</span>' : '<span class="court">🟢 LIVE</span>';
                if (m.duration) right += ' <span style="color:#888;font-size:0.78em;">⏱ ' + esc(m.duration) + '</span>';
            } else if (m.status === "upcoming") {
                right = m.start_time ? '<span class="time">🕐 ' + esc(m.start_time) + '</span>'
                                     : '<span class="byorder">⏳ by order</span>';
            } else {
                right = '<span class="badge-done">✅ done</span>';
            }
            var t1won = m.team1_won && m.status === "done";
            var t2won = (!m.team1_won) && m.status === "done";
            return '<div class="m ' + cls + '">' +
                '<div style="display:flex;justify-content:space-between;gap:6px;align-items:center;">' +
                    '<span class="ev">' + esc(m.event) + (m.round ? " · " + esc(m.round) : "") + '</span>' + right + '</div>' +
                '<div class="vs"><span class="' + (t1won?"won":(m.status==="done"?"lost":"")) + '">' + esc(m.team1) + (t1won?" ✓":"") + '</span></div>' +
                '<div><span class="' + (t2won?"won":(m.status==="done"?"lost":"")) + '">' + esc(m.team2) + (t2won?" ✓":"") + '</span></div>' +
                (m.score ? '<div class="score">' + esc(m.score) + '</div>' : '') +
            '</div>';
        }

        function playerColumn(player, matches) {
            var mine = matches.filter(function(m){ return nameInTeam(player, m.team1) || nameInTeam(player, m.team2); });
            var ongoing = mine.filter(function(m){ return m.status==="ongoing"; });
            var upcoming = mine.filter(function(m){ return m.status==="upcoming"; });
            var done = mine.filter(function(m){ return m.status==="done"; });

            function sect(label, arr, emptyTxt) {
                return '<div class="sect-label">' + label + ' (' + arr.length + ')</div>' +
                    (arr.length ? arr.map(matchHtml).join("") : '<div class="empty">' + emptyTxt + '</div>');
            }
            return '<div class="pcol">' +
                '<div class="pcol__head"><h3>' + esc(player.name) + '</h3>' +
                    '<div class="club">' + esc(player.club||"") + '</div></div>' +
                '<div class="pcol__body">' +
                    sect("🟢 Ongoing", ongoing, "—") +
                    sect("🕒 Upcoming", upcoming, "—") +
                    sect("✅ Finished", done, "No results yet") +
                '</div></div>';
        }

        async function loadBoard(day) {
            document.getElementById("b-name").textContent = tournamentName || "Tournament";
            document.getElementById("b-info").textContent = tournamentInfo || "";
            var board = document.getElementById("board");
            if (!board.children.length) board.innerHTML = '<p style="color:#666;">Loading board…</p>';

            try {
                // Komet players (backend is_komet flag).
                var cData = await (await fetch("/api/tournament-clubs?id=" + encodeURIComponent(tournamentId))).json();
                var players = ((cData && cData.players) || []).filter(isKometFlag);

                // First call (no explicit day) discovers the day list.
                var first = await (await fetch("/api/live-matches?id=" + encodeURIComponent(tournamentId) + (day ? "&date=" + day : ""))).json();
                var days = (first && first.days) || [];
                renderDaySelector(days);

                var matches = [];
                if (day) {
                    // A specific day was picked.
                    selectedDay = (first && first.selected_day) || day;
                    matches = (first && first.matches) || [];
                } else if (days.length > 1) {
                    // DEFAULT: aggregate ALL days so a player's full
                    // ongoing/upcoming/finished picture shows at once (a radiator).
                    selectedDay = "";  // "" means All days
                    var results = await Promise.all(days.map(function(d){
                        return fetch("/api/live-matches?id=" + encodeURIComponent(tournamentId) + "&date=" + d)
                            .then(function(r){ return r.json(); })
                            .then(function(j){ return (j && j.matches) || []; })
                            .catch(function(){ return []; });
                    }));
                    results.forEach(function(arr){ matches = matches.concat(arr); });
                } else {
                    // Single-day tournament.
                    selectedDay = (first && first.selected_day) || "";
                    matches = (first && first.matches) || [];
                }

                if (!players.length) {
                    board.innerHTML = '<p style="color:#666;">No BMK Komet players found in this tournament.</p>';
                } else {
                    board.innerHTML = players.map(function(p){ return playerColumn(p, matches); }).join("");
                }
                var now = new Date();
                document.getElementById("refresh-note").textContent =
                    (selectedDay ? ("Day " + fmtDay(selectedDay)) : "All days") +
                    " · auto-refresh 30s · updated " + now.toLocaleTimeString();
            } catch (e) {
                board.innerHTML = '<p style="color:#c62828;">Could not load dashboard: ' + esc(e.message) + '</p>';
            }
        }

        function renderDaySelector(days) {
            var box = document.getElementById("day-selector");
            if (!days || days.length < 2) { box.innerHTML = ""; return; }
            var html = '<span style="font-size:0.8em;color:#666;margin-right:6px;">Day:</span>';
            // "All days" option (default).
            html += '<button class="daybtn" onclick="pickDay(\'\')" style="' +
                (!selectedDay ? 'background:#0d47a1;color:#fff;' : 'background:#eef2f7;color:#0d47a1;') + '">All</button> ';
            html += days.map(function(d){
                var active = d === selectedDay;
                return '<button class="daybtn" onclick="pickDay(\'' + d + '\')" style="' +
                    (active ? 'background:#0d47a1;color:#fff;' : 'background:#eef2f7;color:#0d47a1;') + '">' + fmtDay(d) + '</button>';
            }).join(" ");
            box.innerHTML = html;
        }
        function pickDay(d) { selectedDay = d; loadBoard(d); }

        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(function(){ loadBoard(selectedDay); }, 30000);
        }

        // ---------------- init ----------------
        if (tournamentId) {
            document.getElementById("filter-view").style.display = "none";
            document.getElementById("board-view").style.display = "block";
            loadBoard();
            startAutoRefresh();
        } else {
            document.getElementById("rangebar").addEventListener("click", function(e){
                var b = e.target.closest(".rangebtn");
                if (b) loadTournaments(b.dataset.range);
            });
            loadTournaments("this_week");
        }
    </script>

    <footer style="margin-top:40px;padding:20px;text-align:center;border-top:1px solid #e0e0e0;color:#666;font-size:0.85em;">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se" style="color:#0d47a1;">support@bmkkomet.se</a></p>
    </footer>
</body>
</html>
