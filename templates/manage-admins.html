<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Admins</title>
    <link rel="stylesheet" href="/static/design-system.css">
</head>
<body>
    <div class="page">
    <nav class="admin-nav">
        <a href="/">Tournaments for Registration</a>
        <a href="/add-remove-tournaments.html">Add/Remove</a>
        <a href="/results.html">Previous Tournaments</a>
        <a href="/send-email.html">Send Email</a>
        <a href="/manage.html">Manage</a>
    </nav>

    <h1 class="page-title">Manage Admins</h1>

    <div class="stack">
        <p><a href="/manage.html">← Back to Manage</a></p>

        <div class="card">
            <div class="card__body">
                <h2 class="card-title">Add Admin</h2>
                <form id="add-admin-form">
                    <div class="field">
                        <label class="field__label" for="new-admin-username">Username (Badminton Sweden login)</label>
                        <input type="text" id="new-admin-username" placeholder="e.g. username or email" required>
                    </div>
                    <div class="field">
                        <label class="field__label" for="new-admin-email">Email (for notifications)</label>
                        <input type="email" id="new-admin-email" placeholder="admin@email.com">
                    </div>
                    <button type="submit" class="btn btn--block">Add Admin</button>
                </form>
                <p id="add-result" class="banner" style="display:none"></p>
            </div>
        </div>

        <h2 class="card-title">Current Admins</h2>
        <div class="card">
            <div id="admin-list" class="card__body"></div>
        </div>
    </div>
    </div>

    <script>
        async function loadAdmins() {
            const container = document.getElementById("admin-list");
            container.innerHTML = "<p class=\"muted\">Loading...</p>";

            try {
                const res = await fetch("/api/list-admins");
                const data = await res.json();

                if (!data.success) {
                    container.innerHTML = `<p class="banner banner--bad">${data.error || 'Failed to load admins'}</p>`;
                    return;
                }

                if (!data.admins || !data.admins.length) {
                    container.innerHTML = "<p class=\"muted\">No admins found.</p>";
                    return;
                }

                container.innerHTML = `<table class="table table--stack">
                    <thead><tr><th>Username</th><th>Email</th><th></th></tr></thead>
                    <tbody>` +
                    data.admins.map(admin => `
                        <tr>
                            <td data-label="Username">${admin.username}</td>
                            <td data-label="Email">${admin.email ? admin.email : '<span class="muted">(no email)</span>'}</td>
                            <td data-label="Actions"><button onclick="removeAdmin('${admin.username.replace(/'/g, "\\'")}')" class="btn btn--danger">Remove</button></td>
                        </tr>
                    `).join("") +
                    `</tbody></table>`;
            } catch (err) {
                container.innerHTML = `<p class="banner banner--bad">Error: ${err.message}</p>`;
            }
        }

        document.getElementById("add-admin-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("new-admin-username").value.trim();
            const email = document.getElementById("new-admin-email").value.trim();
            if (!username) return;

            const resultEl = document.getElementById("add-result");
            resultEl.style.display = "none";

            const res = await fetch("/admin/add-admin-by-id", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, email})
            });
            const data = await res.json();

            if (data.success) {
                resultEl.textContent = `✅ ${username} added as admin`;
                resultEl.className = "banner banner--ok";
                document.getElementById("new-admin-username").value = "";
                document.getElementById("new-admin-email").value = "";
                loadAdmins();
            } else {
                resultEl.textContent = `❌ ${data.error || 'Failed to add admin'}`;
                resultEl.className = "banner banner--bad";
            }
            resultEl.style.display = "block";
        });

        async function removeAdmin(username) {
            if (!confirm(`Remove ${username} as admin?`)) return;

            const res = await fetch("/api/remove-admin", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username})
            });
            const data = await res.json();

            if (data.success) {
                loadAdmins();
            } else {
                alert(data.error || "Failed to remove admin");
            }
        }

        loadAdmins();
    </script>

    <footer class="site-footer">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se">support@bmkkomet.se</a></p>
    </footer>
<script src="/static/devbar.js"></script>
</body>
</html>
