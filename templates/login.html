<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/design-system.css">
</head>
<body>
    <div class="page page--form">
        <h1>Login</h1>
        <div class="card">
            <div class="card__body">
                <p class="muted" style="margin-top:0">Use the same login credentials as your Badminton Sweden account to access tournaments and manage your registrations.</p>
                <form id="login-form">
                    <div class="field">
                        <label class="field__label" for="login">Email / Username</label>
                        <input type="text" id="login" required>
                    </div>
                    <div class="field">
                        <label class="field__label" for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn--block">Login</button>
                </form>
                <div id="error" class="banner banner--bad" style="display:none"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errEl = document.getElementById("error");
            errEl.style.display = "none";
            const res = await fetch("/api/bwf-login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    login: document.getElementById("login").value,
                    password: document.getElementById("password").value
                })
            });
            const data = await res.json();
            if (data.success) window.location.href = "/admin.html";
            else {
                errEl.textContent = data.error || "Login failed";
                errEl.style.display = "block";
            }
        });
    </script>

    <footer class="site-footer">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se">support@bmkkomet.se</a></p>
    </footer>
<script src="/static/devbar.js"></script>
</body>
</html>
