<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Database - Badminton Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            padding: 30px;
        }
        
        .statistics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .database-list {
            display: grid;
            gap: 15px;
        }
        
        .database-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .database-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        .database-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .database-description {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 10px;
        }
        
        .database-info {
            display: flex;
            gap: 30px;
            font-size: 0.9em;
            color: #888;
        }
        
        .table-list {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }
        
        .table-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .table-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }
        
        .table-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .table-info {
            display: flex;
            gap: 20px;
            font-size: 0.85em;
            color: #888;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 10px;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 1.5em;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .close-btn:hover {
            opacity: 1;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #dee2e6;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        table thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        
        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            word-break: break-word;
        }
        
        table td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
            word-break: break-word;
            max-width: 300px;
        }
        
        table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .json-display {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .pagination button {
            padding: 8px 12px;
            border: 1px solid #e9ecef;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .pagination button:hover:not(.active) {
            background: #f8f9fa;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .statistics {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .search-box {
                min-width: 100%;
            }
            
            table {
                font-size: 0.9em;
            }
            
            table th, table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/manage.html" style="display:inline-block;margin-bottom:15px;color:#667eea;text-decoration:none;font-weight:500;">← Back to Manage</a>
        <div class="header">
            <h1>📊 Database Manager</h1>
            <p>View and manage all project databases</p>
        </div>
        
        <div class="main-content">
            <!-- Backup & Restore Section -->
            <div class="section">
                <div class="section-title">💾 Backup & Restore</div>
                <div style="padding:15px;">
                    <div style="display:flex;gap:10px;margin-bottom:15px;">
                        <button onclick="createBackup()" style="padding:10px 20px;background:#28a745;color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.9em;">📦 Create Backup</button>
                        <button onclick="loadBackups()" style="padding:10px 20px;background:#1976d2;color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.9em;">🔄 Refresh List</button>
                    </div>
                    <div id="backup-list" style="font-size:0.9em;color:#333;"></div>
                </div>
            </div>

            <!-- Statistics Section -->
            <div class="section">
                <div class="section-title">📈 Statistics</div>
                <div class="statistics" id="statistics"></div>
            </div>
            
            <!-- Databases Section -->
            <div class="section">
                <div class="section-title">💾 Databases</div>
                <div class="database-list" id="databaseList"></div>
            </div>
        </div>
    </div>
    
    <!-- Table Viewer Modal -->
    <div class="modal" id="tableModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="tableTitle"></h2>
                <button class="close-btn" onclick="closeTableModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="controls">
                    <input type="text" class="search-box" id="searchInput" placeholder="Search in table...">
                    <button class="btn btn-primary btn-small" onclick="performSearch()">🔍 Search</button>
                    <button class="btn btn-secondary btn-small" onclick="exportTable('json')">📥 Export JSON</button>
                    <button class="btn btn-secondary btn-small" onclick="exportTable('csv')">📥 Export CSV</button>
                </div>
                <div id="tableContent"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentDatabase = null;
        let currentTable = null;
        let currentPage = 1;
        let currentSearch = null;
        
        // Load databases on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadDatabases();
            loadBackups();
        });
        
        // ===== Backup & Restore Functions =====
        async function createBackup() {
            if (!confirm("Create a backup of all databases?")) return;
            try {
                const res = await fetch("/api/database/backup", {method: "POST", headers: {"Content-Type": "application/json"}});
                const data = await res.json();
                if (data.success) {
                    alert(`✅ ${data.message}`);
                    loadBackups();
                } else {
                    alert(`❌ ${data.error}`);
                }
            } catch(e) { alert("Error: " + e.message); }
        }

        async function loadBackups() {
            const container = document.getElementById("backup-list");
            try {
                const res = await fetch("/api/database/backups");
                const data = await res.json();
                if (!data.success || !data.backups.length) {
                    container.innerHTML = "<p style='color:#999;'>No backups yet. Click 'Create Backup' to make one.</p>";
                    return;
                }
                container.innerHTML = `
                    <table style="width:100%;border-collapse:collapse;">
                        <thead><tr style="background:#f5f5f5;">
                            <th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">Backup</th>
                            <th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">Files</th>
                            <th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">Size</th>
                            <th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">Actions</th>
                        </tr></thead>
                        <tbody>
                            ${data.backups.map(b => `
                                <tr>
                                    <td style="padding:8px;border-bottom:1px solid #eee;font-family:monospace;">${b.id}</td>
                                    <td style="padding:8px;border-bottom:1px solid #eee;">${b.files.join(", ")}</td>
                                    <td style="padding:8px;border-bottom:1px solid #eee;">${b.size_kb} KB</td>
                                    <td style="padding:8px;border-bottom:1px solid #eee;">
                                        <button onclick="restoreBackup('${b.id}')" style="padding:4px 10px;background:#f57c00;color:white;border:none;border-radius:4px;cursor:pointer;font-size:0.85em;margin-right:5px;">♻️ Restore</button>
                                        <button onclick="deleteBackup('${b.id}')" style="padding:4px 10px;background:#d32f2f;color:white;border:none;border-radius:4px;cursor:pointer;font-size:0.85em;">🗑️ Delete</button>
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>`;
            } catch(e) { container.innerHTML = `<p style="color:red;">Error: ${e.message}</p>`; }
        }

        async function restoreBackup(backupId) {
            if (!confirm(`⚠️ Restore databases from backup '${backupId}'?\n\nThis will OVERWRITE current databases.\nA pre-restore backup will be saved automatically.`)) return;
            try {
                const res = await fetch("/api/database/restore", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({backup_id: backupId})
                });
                const data = await res.json();
                if (data.success) {
                    alert(`✅ ${data.message}\n\nRestored: ${data.restored.join(", ")}\n\nRefresh the page to see updated data.`);
                    loadBackups();
                    loadDatabases();
                } else {
                    alert(`❌ ${data.error}`);
                }
            } catch(e) { alert("Error: " + e.message); }
        }

        async function deleteBackup(backupId) {
            if (!confirm(`Delete backup '${backupId}'?`)) return;
            try {
                const res = await fetch(`/api/database/backup/${backupId}`, {method: "DELETE"});
                const data = await res.json();
                if (data.success) { loadBackups(); }
                else { alert(`❌ ${data.error}`); }
            } catch(e) { alert("Error: " + e.message); }
        }
        
        function loadDatabases() {
            fetch('/api/databases')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayStatistics(data.statistics);
                        displayDatabases(data.databases);
                    } else {
                        showError('Failed to load databases');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Error loading databases: ' + error);
                });
        }
        
        function displayStatistics(stats) {
            const html = `
                <div class="stat-card">
                    <div class="stat-number">${stats.total_tables}</div>
                    <div class="stat-label">Total Tables</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.total_rows.toLocaleString()}</div>
                    <div class="stat-label">Total Rows</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.total_size_mb}</div>
                    <div class="stat-label">Total Size (MB)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.databases.length}</div>
                    <div class="stat-label">Active Databases</div>
                </div>
            `;
            document.getElementById('statistics').innerHTML = html;
        }
        
        function displayDatabases(databases) {
            let html = '';
            
            for (const db of databases) {
                if (!db.exists) continue;
                
                html += `
                    <div class="database-card" onclick="loadTables('${db.name}')">
                        <div class="database-name">💾 ${db.name}</div>
                        <div class="database-description">${db.description}</div>
                        <div class="database-info">
                            <span>📦 ${db.size_mb}MB</span>
                            <span>🕐 ${new Date(db.modified).toLocaleString()}</span>
                        </div>
                        <div id="tables-${db.name}" class="table-list"></div>
                    </div>
                `;
            }
            
            document.getElementById('databaseList').innerHTML = html;
        }
        
        function loadTables(dbName) {
            fetch(`/api/database/${dbName}/tables`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayTables(dbName, data.tables);
                    } else {
                        showError('Failed to load tables: ' + data.error);
                    }
                })
                .catch(error => showError('Error: ' + error));
        }
        
        function displayTables(dbName, tables) {
            let html = '';
            
            for (const table of tables) {
                html += `
                    <div class="table-item" onclick="viewTable('${dbName}', '${table.name}')">
                        <div class="table-name">📄 ${table.name}</div>
                        <div class="table-info">
                            <span>📋 ${table.column_count} columns</span>
                            <span>📊 ${table.row_count.toLocaleString()} rows</span>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById(`tables-${dbName}`).innerHTML = html;
        }
        
        function viewTable(dbName, tableName) {
            currentDatabase = dbName;
            currentTable = tableName;
            currentPage = 1;
            currentSearch = null;
            
            document.getElementById('tableTitle').textContent = `📊 ${dbName} → ${tableName}`;
            document.getElementById('tableModal').classList.add('active');
            
            loadTableData();
        }
        
        function loadTableData() {
            const params = new URLSearchParams({
                page: currentPage,
                page_size: 20
            });
            
            if (currentSearch) {
                params.append('search', currentSearch);
            }
            
            const url = `/api/database/${currentDatabase}/table/${currentTable}?${params}`;
            
            document.getElementById('tableContent').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayTableData(data);
                    } else {
                        showError('Failed to load table: ' + data.error);
                    }
                })
                .catch(error => showError('Error: ' + error));
        }
        
        function displayTableData(data) {
            let html = '<table><thead><tr>';
            
            // Add column headers
            for (const col of data.columns) {
                html += `<th>${col}</th>`;
            }
            html += '</tr></thead><tbody>';
            
            // Add rows
            for (const row of data.rows) {
                html += '<tr>';
                for (const col of data.columns) {
                    let value = row[col];
                    if (value === null || value === undefined) {
                        value = '<em style="color: #999;">NULL</em>';
                    } else if (typeof value === 'object') {
                        value = '<code>' + JSON.stringify(value) + '</code>';
                    }
                    html += `<td>${value}</td>`;
                }
                html += '</tr>';
            }
            
            html += '</tbody></table>';
            
            // Add pagination
            const pagination = data.pagination;
            html += '<div class="pagination">';
            
            if (pagination.has_previous) {
                html += `<button onclick="previousPage()">← Previous</button>`;
            }
            
            for (let i = 1; i <= pagination.total_pages; i++) {
                const active = i === currentPage ? 'active' : '';
                html += `<button class="${active}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            if (pagination.has_next) {
                html += `<button onclick="nextPage()">Next →</button>`;
            }
            
            html += `</div>`;
            html += `<p style="text-align: center; color: #888; margin-top: 10px;">Page ${pagination.current_page} of ${pagination.total_pages} | Total: ${pagination.total_rows.toLocaleString()} rows</p>`;
            
            document.getElementById('tableContent').innerHTML = html;
        }
        
        function performSearch() {
            currentSearch = document.getElementById('searchInput').value;
            currentPage = 1;
            loadTableData();
        }
        
        function goToPage(page) {
            currentPage = page;
            loadTableData();
        }
        
        function nextPage() {
            currentPage++;
            loadTableData();
        }
        
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadTableData();
            }
        }
        
        function exportTable(format) {
            const url = `/api/database/${currentDatabase}/table/${currentTable}/export?format=${format}`;
            const link = document.createElement('a');
            link.href = url;
            link.download = `${currentTable}.${format}`;
            link.click();
        }
        
        function closeTableModal() {
            document.getElementById('tableModal').classList.remove('active');
        }
        
        function showError(message) {
            console.error(message);
            alert('Error: ' + message);
        }
        
        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeTableModal();
            }
        });
    </script>
</body>
</html>
