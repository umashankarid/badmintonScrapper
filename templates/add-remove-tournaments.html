<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Remove Tournaments</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Add/Remove Tournaments</h1>
    <a href="/">← Back to home</a>

    <div style="margin-top:20px;">
        <h2>Available Tournaments from Badminton Sweden</h2>
        <p style="color:#666;font-size:0.9em;">Check the tournaments you want to appear in the available tournaments list for the players.</p>
        <div style="margin-bottom:15px;">
            <button onclick="hardRefresh()" style="width:auto;padding:8px 14px;background:#f57c00;font-size:0.85em;">🔄 Hard Refresh from Badminton Sweden</button>
            <span id="cache-status" style="color:#999;font-size:0.85em;margin-left:10px;"></span>
        </div>
        <div id="bwf-tournaments-list"></div>
        <button id="save-btn" onclick="saveSelection()" style="margin-top:20px;background:#28a745;padding:12px 24px;font-size:1em;">Save Selected Tournaments</button>
    </div>

    <script>
        async function loadTournaments(force = false) {
            const container = document.getElementById("bwf-tournaments-list");
            const cacheStatus = document.getElementById("cache-status");
            container.innerHTML = "<p style='color: #999;'>Loading tournaments...</p>";
            cacheStatus.textContent = force ? "Fetching fresh data..." : "";
            
            try {
                const url = force ? "/api/bwf-tournaments-all?force=true" : "/api/bwf-tournaments-all";
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.cached) {
                    cacheStatus.textContent = "✅ Using today's cached data";
                } else {
                    cacheStatus.textContent = "✅ Fresh data loaded";
                }
                
                if (!res.ok) {
                    container.innerHTML = `<p style="color: red;">HTTP Error ${res.status}: ${data.error || 'Failed to load tournaments'}</p>`;
                    return;
                }
                
                if (!data.success) {
                    container.innerHTML = `<p style="color: red;">Error: ${data.error || 'Failed to load tournaments'}</p>`;
                    return;
                }
                
                if (!data.tournaments || !data.tournaments.length) {
                    container.innerHTML = "<p>No tournaments currently available on Badminton Sweden.<br><small style='color: #999;'>This might mean there are no tournaments scheduled in the near future, or the website is temporarily unavailable.</small></p>";
                    return;
                }

                container.innerHTML = `<div style="display: flex; flex-direction: column; gap: 12px;">` +
                    data.tournaments.map(t => `
                        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; background: white; border: 1px solid #e0e0e0; border-radius: 8px;">
                            <input type="checkbox" class="bwf-tournament-checkbox" 
                                data-url="${t.url}" 
                                data-name="${t.name.replace(/"/g, '&quot;')}"
                                data-location="${(t.location || '').replace(/"/g, '&quot;')}"
                                data-date-start="${t.date_start || ''}"
                                data-date-end="${t.date_end || ''}"
                                data-registration-opens="${t.registration_opens || ''}"
                                data-registration-closes="${t.registration_closes || ''}"
                                data-cancellation-deadline="${t.cancellation_deadline || ''}"
                                data-competition-start="${t.competition_start || ''}"
                                data-competition-end="${t.competition_end || ''}"
                                ${t.selected_for_view ? 'checked' : ''} 
                                style="cursor: pointer; width: 20px; height: 20px;">
                            <div style="flex: 1;">
                                <div style="font-weight: bold; color: #1a237e;">${t.name}</div>
                                <div style="color: #666; font-size: 0.9em;">${t.location} • ${t.date_start}${t.date_end ? ' to ' + t.date_end : ''}</div>
                            </div>
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                                <label style="font-size:0.75em;color:#666;margin:0;">Reg. deadline</label>
                                <input type="date" class="reg-end-date" 
                                    data-tournament-name="${t.name.replace(/"/g, '&quot;')}"
                                    value="${t.admin_reg_end_date || ''}" 
                                    onchange="saveRegDate(this)"
                                    style="padding:4px 6px;font-size:0.85em;width:auto;margin:0;">
                            </div>
                        </div>
                    `).join("") +
                    `</div>`;
            } catch (err) {
                container.innerHTML = `<p style="color: red;">Error loading tournaments: ${err.message}</p>`;
            }
        }

        async function saveSelection() {
            const selected = [];
            document.querySelectorAll(".bwf-tournament-checkbox:checked").forEach(checkbox => {
                selected.push({
                    url: checkbox.dataset.url,
                    name: checkbox.dataset.name,
                    location: checkbox.dataset.location,
                    date_start: checkbox.dataset.dateStart,
                    date_end: checkbox.dataset.dateEnd,
                    registration_opens: checkbox.dataset.registrationOpens,
                    registration_closes: checkbox.dataset.registrationCloses,
                    cancellation_deadline: checkbox.dataset.cancellationDeadline,
                    competition_start: checkbox.dataset.competitionStart,
                    competition_end: checkbox.dataset.competitionEnd
                });
            });
            
            const res = await fetch("/api/bwf-tournament-visibility/save", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({tournaments: selected})
            });
            const data = await res.json();
            
            if (data.success) {
                alert("Tournaments saved! Selected tournaments will now appear on the homepage.");
            } else {
                alert(data.error || "Failed to save");
            }
        }

        function hardRefresh() {
            loadTournaments(true);
        }

        async function saveRegDate(input) {
            const tournamentName = input.dataset.tournamentName;
            const date = input.value;
            const res = await fetch("/api/tournament-reg-date", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({tournament_name: tournamentName, admin_reg_end_date: date})
            });
            const data = await res.json();
            if (data.success) {
                input.style.borderColor = "#4caf50";
                setTimeout(() => { input.style.borderColor = ""; }, 1500);
            } else {
                alert(data.error || "Failed to save date");
            }
        }

        loadTournaments();
    </script>
</body>
</html>
