<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:5px;gap:10px;">
        <span style="font-weight:bold;font-size:0.9em;color:#333;" id="admin-header-name"></span>
        <button onclick="window.location.href='/'" style="width:auto;padding:6px 14px;background:#666;font-size:0.85em;border:none;border-radius:4px;color:white;cursor:pointer;">Logout</button>
    </div>
    <nav style="display:flex;border-bottom:2px solid #e0e0e0;gap:0;margin-bottom:20px;flex-wrap:wrap;">
        <a href="/" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Tournaments for Registration</a>
        <a href="/add-remove-tournaments.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Add/Remove</a>
        <a href="/results.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Previous Tournaments</a>
        <a href="/send-email.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:600;color:#0d47a1;border-bottom:3px solid #0d47a1;margin-bottom:-2px;">Send Email</a>
        <a href="/manage.html" style="text-decoration:none;padding:10px 18px;font-size:0.9em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;">Manage</a>
    </nav>
    <script>
        fetch("/api/bwf-status").then(r=>r.json()).then(d=>{
            const el = document.getElementById("admin-header-name");
            if(el && d.logged_in) el.textContent = "Admin: " + d.player_name;
            if(!d.is_admin) window.location.href = "/";
        });
        document.querySelector('[onclick*="location"]').onclick = async () => {
            await fetch("/api/bwf-logout", {method:"POST"});
            window.location.href = "/";
        };
    </script>

    <div style="margin-top:20px;max-width:700px;">
        <form id="email-form">
            <label>Load Recipients</label>
            <div style="margin-bottom:10px;padding:12px;background:#f5f5f5;border-radius:8px;">
                <div style="display:flex;gap:15px;margin-bottom:10px;">
                    <label style="cursor:pointer;font-size:0.9em;"><input type="radio" name="load-type" value="tournament" onchange="showLoadOption()"> By Tournament</label>
                    <label style="cursor:pointer;font-size:0.9em;"><input type="radio" name="load-type" value="group" onchange="showLoadOption()"> By Group</label>
                    <label style="cursor:pointer;font-size:0.9em;"><input type="radio" name="load-type" value="all" onchange="showLoadOption()"> All Komet Players</label>
                </div>
                
                <div id="tournament-option" style="display:none;">
                    <select id="tournament-select" style="width:100%;padding:8px;font-size:0.9em;">
                        <option value="">-- Select tournament --</option>
                    </select>
                    <button type="button" onclick="loadFromTournament()" style="margin-top:8px;width:auto;padding:6px 14px;background:#0d47a1;font-size:0.85em;">Load Emails</button>
                </div>
                
                <div id="group-option" style="display:none;">
                    <select id="group-select" multiple style="width:100%;padding:8px;font-size:0.9em;height:80px;">
                    </select>
                    <p style="color:#999;font-size:0.8em;margin:4px 0 0;">Hold Ctrl/Cmd to select multiple groups</p>
                    <button type="button" onclick="loadFromGroups()" style="margin-top:8px;width:auto;padding:6px 14px;background:#0d47a1;font-size:0.85em;">Load Emails</button>
                </div>
                
                <div id="all-option" style="display:none;">
                    <button type="button" onclick="loadAllKometEmails()" style="width:auto;padding:6px 14px;background:#0d47a1;font-size:0.85em;">Load All Komet Player Emails</button>
                </div>
            </div>

            <label>To (email addresses — comma or semicolon separated)</label>
            <textarea id="email-to" rows="3" placeholder="Email addresses will be loaded here..." style="width:100%;font-size:0.9em;" oninput="validateEmails()"></textarea>
            <div id="email-validation" style="margin-top:4px;font-size:0.8em;"></div>
            <div id="invalid-emails" style="display:none;margin-top:6px;padding:8px 12px;background:#ffebee;border:1px solid #ef9a9a;border-radius:6px;font-size:0.85em;color:#c62828;"></div>
            
            <label>Subject</label>
            <input type="text" id="email-subject" placeholder="Email subject" required>
            
            <label>Message</label>
            <textarea id="email-body" rows="10" placeholder="Write your message here..." required style="width:100%;font-size:0.95em;"></textarea>
            
            <label style="margin-top:10px;">Attachments (optional)</label>
            <input type="file" id="email-attachments" multiple style="font-size:0.9em;margin-bottom:5px;">
            <p style="color:#999;font-size:0.8em;margin:0;">Max 10MB per file. Multiple files allowed.</p>
            
            <div style="display:flex;gap:10px;margin-top:15px;">
                <button type="submit" style="background:#28a745;">Send to All</button>
                <button type="button" onclick="sendTest()" style="background:#f57c00;">Send Test to Me</button>
            </div>
        </form>
        
        <div id="send-result" style="display:none;margin-top:15px;padding:12px;border-radius:6px;"></div>
    </div>

    <script>
        function showLoadOption() {
            document.getElementById("tournament-option").style.display = "none";
            document.getElementById("group-option").style.display = "none";
            document.getElementById("all-option").style.display = "none";
            
            const selected = document.querySelector('input[name="load-type"]:checked');
            if (selected) {
                document.getElementById(selected.value + "-option").style.display = "block";
            }
        }

        async function loadTournaments() {
            try {
                // Use bwf-tournaments-all cached data for admin (shows all selected tournaments)
                const res = await fetch("/api/bwf-tournaments-all");
                const data = await res.json();
                const select = document.getElementById("tournament-select");
                if (data.success && data.tournaments) {
                    data.tournaments.filter(t => t.selected_for_view).forEach(t => {
                        const opt = document.createElement("option");
                        opt.value = t.name;
                        opt.textContent = t.name;
                        select.appendChild(opt);
                    });
                }
            } catch(e) {}
        }

        async function loadPlayerGroups() {
            try {
                const res = await fetch("/api/player-groups");
                const data = await res.json();
                const select = document.getElementById("group-select");
                if (data.success && data.groups) {
                    data.groups.forEach(g => {
                        const opt = document.createElement("option");
                        opt.value = g.group_name;
                        opt.textContent = g.group_name;
                        select.appendChild(opt);
                    });
                }
            } catch(e) {}
        }

        async function loadFromTournament() {
            const tournament = document.getElementById("tournament-select").value;
            if (!tournament) { alert("Select a tournament first"); return; }
            try {
                const res = await fetch(`/api/registered-emails?tournament=${encodeURIComponent(tournament)}`);
                const data = await res.json();
                if (data.success) {
                    const emails = data.emails.filter(e => e && e.includes("@"));
                    document.getElementById("email-to").value = emails.join(", ");
                    validateEmails();
                }
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        async function loadFromGroups() {
            const select = document.getElementById("group-select");
            const selectedGroups = Array.from(select.selectedOptions).map(o => o.value);
            if (!selectedGroups.length) { alert("Select at least one group"); return; }
            
            try {
                // Fetch emails for each selected group and combine
                let allEmails = new Set();
                for (const group of selectedGroups) {
                    const res = await fetch(`/api/group-emails?group=${encodeURIComponent(group)}`);
                    const data = await res.json();
                    if (data.success) {
                        data.emails.filter(e => e && e.includes("@")).forEach(e => allEmails.add(e));
                    }
                }
                const emails = Array.from(allEmails);
                document.getElementById("email-to").value = emails.join(", ");
                validateEmails();
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        async function loadAllKometEmails() {
            try {
                const res = await fetch("/api/group-emails");
                const data = await res.json();
                if (data.success) {
                    const emails = data.emails.filter(e => e && e.includes("@"));
                    document.getElementById("email-to").value = emails.join(", ");
                    validateEmails();
                }
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        function parseEmails(text) {
            // Accept comma, semicolon, or newline as separators
            return text.split(/[,;\n]+/).map(e => e.trim()).filter(e => e.length > 0);
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validateEmails() {
            const text = document.getElementById("email-to").value;
            const emails = parseEmails(text);
            const validationEl = document.getElementById("email-validation");
            const invalidEl = document.getElementById("invalid-emails");
            
            if (!emails.length) {
                validationEl.innerHTML = "";
                invalidEl.style.display = "none";
                return {valid: [], invalid: []};
            }

            const valid = emails.filter(isValidEmail);
            const invalid = emails.filter(e => !isValidEmail(e));

            let html = `<span style="color:#2e7d32;">✅ ${valid.length} valid</span>`;
            if (invalid.length) {
                html += ` &nbsp; <span style="color:#c62828;">❌ ${invalid.length} invalid</span>`;
            }
            validationEl.innerHTML = html;

            if (invalid.length) {
                invalidEl.style.display = "block";
                invalidEl.innerHTML = `<strong>Invalid emails:</strong> ${invalid.map(e => `<span style="background:#ffcdd2;padding:2px 6px;border-radius:3px;margin:2px;display:inline-block;">${e}</span>`).join(" ")}`;
            } else {
                invalidEl.style.display = "none";
            }

            return {valid, invalid};
        }

        document.getElementById("email-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const {valid, invalid} = validateEmails();
            
            if (!valid.length) { alert("No valid email addresses"); return; }
            if (invalid.length) {
                if (!confirm(`There are ${invalid.length} invalid email(s) that will be skipped:\n\n${invalid.join(", ")}\n\nSend to ${valid.length} valid recipient(s)?`)) return;
            } else {
                if (!confirm(`Send email to ${valid.length} recipient${valid.length !== 1 ? 's' : ''}?`)) return;
            }
            
            const subject = document.getElementById("email-subject").value;
            const body = document.getElementById("email-body").value;
            if (!subject || !body) { alert("Subject and message required"); return; }
            
            const resultEl = document.getElementById("send-result");
            resultEl.style.display = "block";
            resultEl.style.background = "#e3f2fd";
            resultEl.style.color = "#1565c0";
            resultEl.textContent = `Sending to ${valid.length} recipients...`;
            
            // Use FormData if there are attachments
            const fileInput = document.getElementById("email-attachments");
            const hasFiles = fileInput.files.length > 0;
            
            let res;
            if (hasFiles) {
                const formData = new FormData();
                formData.append("emails", valid.join(","));
                formData.append("subject", subject);
                formData.append("body", body);
                for (const file of fileInput.files) {
                    formData.append("attachments", file);
                }
                res = await fetch("/api/send-bulk-email", {
                    method: "POST",
                    body: formData
                });
            } else {
                res = await fetch("/api/send-bulk-email", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({emails: valid, subject, body})
                });
            }
            const data = await res.json();
            
            if (data.success) {
                resultEl.style.background = "#e8f5e9";
                resultEl.style.color = "#2e7d32";
                resultEl.textContent = `✅ Sent to ${data.sent} of ${data.total} recipients.${data.failed > 0 ? ` (${data.failed} failed)` : ''}`;
            } else {
                resultEl.style.background = "#ffebee";
                resultEl.style.color = "#c62828";
                resultEl.textContent = `❌ ${data.error || 'Failed to send'}`;
            }
        });

        async function sendTest() {
            const subject = document.getElementById("email-subject").value;
            const body = document.getElementById("email-body").value;
            if (!subject || !body) { alert("Enter subject and message first"); return; }
            
            const res = await fetch("/api/bwf-status");
            const status = await res.json();
            const myEmail = status.email;
            if (!myEmail) { alert("Your email not found. Log in first."); return; }
            
            const resultEl = document.getElementById("send-result");
            resultEl.style.display = "block";
            resultEl.style.background = "#e3f2fd";
            resultEl.style.color = "#1565c0";
            resultEl.textContent = `Sending test to ${myEmail}...`;
            
            const sendRes = await fetch("/api/send-bulk-email", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({emails: [myEmail], subject: "[TEST] " + subject, body})
            });
            const data = await sendRes.json();
            
            if (data.success) {
                resultEl.style.background = "#e8f5e9";
                resultEl.style.color = "#2e7d32";
                resultEl.textContent = `✅ Test email sent to ${myEmail}`;
            } else {
                resultEl.style.background = "#ffebee";
                resultEl.style.color = "#c62828";
                resultEl.textContent = `❌ ${data.error || 'Failed to send test'}`;
            }
        }

        loadTournaments();
        loadPlayerGroups();
    </script>

    <footer style="margin-top:40px;padding:20px;text-align:center;border-top:1px solid #e0e0e0;color:#666;font-size:0.85em;">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se" style="color:#0d47a1;">support@bmkkomet.se</a></p>
    </footer>
</body>
</html>
