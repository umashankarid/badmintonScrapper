<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email</title>
    <link rel="stylesheet" href="/static/design-system.css">
</head>
<body>
    <div class="page">
    <div class="topbar">
        <span id="admin-header-name" style="font-weight:600"></span>
        <button onclick="window.location.href='/'" class="btn btn--secondary">Logout</button>
    </div>
    <nav class="admin-nav">
        <a href="/">Tournaments for Registration</a>
        <a href="/add-remove-tournaments.html">Add/Remove</a>
        <a href="/results.html">Previous Tournaments</a>
        <a href="/send-email.html" class="is-active">Send Email</a>
        <a href="/manage.html">Manage</a>
    </nav>
    <script>
        fetch("/api/bwf-status").then(r=>r.json()).then(d=>{
            const el = document.getElementById("admin-header-name");
            if(el && d.logged_in) el.textContent = "Admin: " + d.player_name;
            if(!d.is_admin) window.location.href = "/";
        });
        document.querySelector('[onclick*="location"]').onclick = async () => {
            await fetch("/api/bwf-logout", {method:"POST"});
            window.location.href = "/";
        };
    </script>

    <h1 class="page-title">Send Email</h1>

    <div class="card">
        <div class="card__body stack">
            <form id="email-form">
                <div class="field">
                    <label class="field__label">Load Recipients</label>
                    <div class="inset stack">
                        <div style="display:flex;gap:var(--sp-4);flex-wrap:wrap;">
                            <label class="check-row"><input type="radio" name="load-type" value="tournament" onchange="showLoadOption()"> By Tournament</label>
                            <label class="check-row"><input type="radio" name="load-type" value="group" onchange="showLoadOption()"> By Group</label>
                            <label class="check-row"><input type="radio" name="load-type" value="all" onchange="showLoadOption()"> All Komet Players</label>
                        </div>

                        <div id="tournament-option" class="stack" style="display:none">
                            <select id="tournament-select">
                                <option value="">-- Select tournament --</option>
                            </select>
                            <button type="button" onclick="loadFromTournament()" class="btn btn--secondary">Load Emails</button>
                        </div>

                        <div id="group-option" class="stack" style="display:none">
                            <select id="group-select" multiple size="6"></select>
                            <p class="muted">Hold Ctrl/Cmd to select multiple groups</p>
                            <button type="button" onclick="loadFromGroups()" class="btn btn--secondary">Load Emails</button>
                        </div>

                        <div id="all-option" style="display:none">
                            <button type="button" onclick="loadAllKometEmails()" class="btn btn--secondary">Load All Komet Player Emails</button>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="field__label" for="email-to">To (email addresses — comma or semicolon separated)</label>
                    <textarea id="email-to" rows="3" placeholder="Email addresses will be loaded here..." oninput="validateEmails()"></textarea>
                    <div id="email-validation"></div>
                    <div id="invalid-emails" class="banner banner--bad" style="display:none"></div>
                </div>

                <div class="field">
                    <label class="field__label" for="email-subject">Subject</label>
                    <input type="text" id="email-subject" placeholder="Email subject" required>
                </div>

                <div class="field">
                    <span class="field__label" id="email-body-label">Message</span>
                    <div class="rich-editor-toolbar" style="display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin-bottom:var(--sp-2);">
                        <button type="button" onclick="execCmd('bold')" title="Bold" class="btn btn--secondary"><strong>B</strong></button>
                        <button type="button" onclick="execCmd('italic')" title="Italic" class="btn btn--secondary"><em>I</em></button>
                        <button type="button" onclick="execCmd('underline')" title="Underline" class="btn btn--secondary"><u>U</u></button>
                        <select onchange="execCmdVal('fontSize', this.value); this.value='';">
                            <option value="">Size</option>
                            <option value="1">Small</option>
                            <option value="3">Normal</option>
                            <option value="5">Large</option>
                            <option value="7">Huge</option>
                        </select>
                        <select onchange="execCmdVal('foreColor', this.value); this.value='';">
                            <option value="">Color</option>
                            <option value="#0f2544" style="color:var(--ink);">Black</option>
                            <option value="#b42318" style="color:var(--bad);">Red</option>
                            <option value="#1d4ed8" style="color:var(--blue);">Blue</option>
                            <option value="#0f7a52" style="color:var(--ok);">Green</option>
                            <option value="#b45309" style="color:var(--warn);">Orange</option>
                        </select>
                        <button type="button" onclick="execCmd('insertUnorderedList')" title="Bullet list" class="btn btn--secondary">&bull;</button>
                        <button type="button" onclick="execCmd('insertOrderedList')" title="Numbered list" class="btn btn--secondary">1.</button>
                    </div>
                    <div id="email-body" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="email-body-label" data-placeholder="Write your message here..."></div>
                </div>

                <div class="field">
                    <label class="field__label" for="email-attachments">Attachments (optional)</label>
                    <input type="file" id="email-attachments" multiple>
                    <p class="muted">Max 10MB per file. Multiple files allowed.</p>
                </div>

                <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;">
                    <button type="submit" class="btn">Send to All</button>
                    <button type="button" onclick="sendTest()" class="btn btn--secondary">Send Test to Me</button>
                </div>
            </form>

            <p id="send-result" class="banner" style="display:none"></p>
        </div>
    </div>
    </div>

    <script>
        // Rich text editor functions
        function execCmd(cmd) {
            document.execCommand(cmd, false, null);
            document.getElementById("email-body").focus();
        }
        function execCmdVal(cmd, val) {
            if (val) document.execCommand(cmd, false, val);
            document.getElementById("email-body").focus();
        }
        function getEmailBody() {
            const el = document.getElementById("email-body");
            return el.innerHTML.trim();
        }
        function getEmailBodyText() {
            const el = document.getElementById("email-body");
            return el.innerText.trim();
        }

        // Placeholder behavior for contenteditable
        document.addEventListener("DOMContentLoaded", () => {
            const editor = document.getElementById("email-body");
            editor.addEventListener("focus", () => {
                if (editor.innerHTML === "" || editor.innerHTML === "<br>") editor.innerHTML = "";
            });
            editor.addEventListener("blur", () => {
                if (editor.innerText.trim() === "") editor.innerHTML = "";
            });
        });

        function showLoadOption() {
            document.getElementById("tournament-option").style.display = "none";
            document.getElementById("group-option").style.display = "none";
            document.getElementById("all-option").style.display = "none";

            const selected = document.querySelector('input[name="load-type"]:checked');
            if (selected) {
                document.getElementById(selected.value + "-option").style.display = "block";
            }
        }

        async function loadTournaments() {
            try {
                // Use bwf-tournaments-all cached data for admin (shows all selected tournaments)
                const res = await fetch("/api/bwf-tournaments-all");
                const data = await res.json();
                const select = document.getElementById("tournament-select");
                if (data.success && data.tournaments) {
                    data.tournaments.filter(t => t.selected_for_view).forEach(t => {
                        const opt = document.createElement("option");
                        opt.value = t.name;
                        opt.textContent = t.name;
                        select.appendChild(opt);
                    });
                }
            } catch(e) {}
        }

        async function loadPlayerGroups() {
            try {
                const res = await fetch("/api/player-groups");
                const data = await res.json();
                const select = document.getElementById("group-select");
                if (data.success && data.groups) {
                    data.groups.forEach(g => {
                        const opt = document.createElement("option");
                        opt.value = g.group_name;
                        opt.textContent = g.group_name;
                        select.appendChild(opt);
                    });
                }
            } catch(e) {}
        }

        async function loadFromTournament() {
            const tournament = document.getElementById("tournament-select").value;
            if (!tournament) { alert("Select a tournament first"); return; }
            try {
                const res = await fetch(`/api/registered-emails?tournament=${encodeURIComponent(tournament)}`);
                const data = await res.json();
                if (data.success) {
                    const emails = data.emails.filter(e => e && e.includes("@"));
                    document.getElementById("email-to").value = emails.join(", ");
                    validateEmails();
                }
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        async function loadFromGroups() {
            const select = document.getElementById("group-select");
            const selectedGroups = Array.from(select.selectedOptions).map(o => o.value);
            if (!selectedGroups.length) { alert("Select at least one group"); return; }

            try {
                // Fetch emails for each selected group and combine
                let allEmails = new Set();
                for (const group of selectedGroups) {
                    const res = await fetch(`/api/group-emails?group=${encodeURIComponent(group)}`);
                    const data = await res.json();
                    if (data.success) {
                        data.emails.filter(e => e && e.includes("@")).forEach(e => allEmails.add(e));
                    }
                }
                const emails = Array.from(allEmails);
                document.getElementById("email-to").value = emails.join(", ");
                validateEmails();
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        async function loadAllKometEmails() {
            try {
                const res = await fetch("/api/group-emails");
                const data = await res.json();
                if (data.success) {
                    const emails = data.emails.filter(e => e && e.includes("@"));
                    document.getElementById("email-to").value = emails.join(", ");
                    validateEmails();
                }
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        function parseEmails(text) {
            // Accept comma, semicolon, or newline as separators
            return text.split(/[,;\n]+/).map(e => e.trim()).filter(e => e.length > 0);
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validateEmails() {
            const text = document.getElementById("email-to").value;
            const emails = parseEmails(text);
            const validationEl = document.getElementById("email-validation");
            const invalidEl = document.getElementById("invalid-emails");

            if (!emails.length) {
                validationEl.innerHTML = "";
                invalidEl.style.display = "none";
                return {valid: [], invalid: []};
            }

            const valid = emails.filter(isValidEmail);
            const invalid = emails.filter(e => !isValidEmail(e));

            let html = `<span class="badge badge--ok">${valid.length} valid</span>`;
            if (invalid.length) {
                html += ` <span class="badge badge--bad">${invalid.length} invalid</span>`;
            }
            validationEl.innerHTML = html;

            if (invalid.length) {
                invalidEl.style.display = "block";
                invalidEl.innerHTML = `<strong>Invalid emails:</strong> ${invalid.map(e => `<span class="badge badge--bad">${e}</span>`).join(" ")}`;
            } else {
                invalidEl.style.display = "none";
            }

            return {valid, invalid};
        }

        document.getElementById("email-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const {valid, invalid} = validateEmails();

            if (!valid.length) { alert("No valid email addresses"); return; }
            if (invalid.length) {
                if (!confirm(`There are ${invalid.length} invalid email(s) that will be skipped:\n\n${invalid.join(", ")}\n\nSend to ${valid.length} valid recipient(s)?`)) return;
            } else {
                if (!confirm(`Send email to ${valid.length} recipient${valid.length !== 1 ? 's' : ''}?`)) return;
            }

            const subject = document.getElementById("email-subject").value;
            const body = getEmailBody();
            if (!subject || !getEmailBodyText()) { alert("Subject and message required"); return; }

            const resultEl = document.getElementById("send-result");
            resultEl.style.display = "block";
            resultEl.className = "banner";
            resultEl.textContent = `Sending to ${valid.length} recipients...`;

            // Use FormData if there are attachments
            const fileInput = document.getElementById("email-attachments");
            const hasFiles = fileInput.files.length > 0;

            let res;
            if (hasFiles) {
                const formData = new FormData();
                formData.append("emails", valid.join(","));
                formData.append("subject", subject);
                formData.append("body", body);
                for (const file of fileInput.files) {
                    formData.append("attachments", file);
                }
                res = await fetch("/api/send-bulk-email", {
                    method: "POST",
                    body: formData
                });
            } else {
                res = await fetch("/api/send-bulk-email", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({emails: valid, subject, body})
                });
            }
            const data = await res.json();

            if (data.success) {
                resultEl.className = "banner banner--ok";
                resultEl.textContent = `Sent to ${data.sent} of ${data.total} recipients.${data.failed > 0 ? ` (${data.failed} failed)` : ''}`;
            } else {
                resultEl.className = "banner banner--bad";
                resultEl.textContent = data.error || 'Failed to send';
            }
        });

        async function sendTest() {
            const subject = document.getElementById("email-subject").value;
            const body = getEmailBody();
            if (!subject || !getEmailBodyText()) { alert("Enter subject and message first"); return; }

            const res = await fetch("/api/bwf-status");
            const status = await res.json();
            const myEmail = status.email;
            if (!myEmail) { alert("Your email not found. Log in first."); return; }

            const resultEl = document.getElementById("send-result");
            resultEl.style.display = "block";
            resultEl.className = "banner";
            resultEl.textContent = `Sending test to ${myEmail}...`;

            const sendRes = await fetch("/api/send-bulk-email", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({emails: [myEmail], subject: "[TEST] " + subject, body})
            });
            const data = await sendRes.json();

            if (data.success) {
                resultEl.className = "banner banner--ok";
                resultEl.textContent = `Test email sent to ${myEmail}`;
            } else {
                resultEl.className = "banner banner--bad";
                resultEl.textContent = data.error || 'Failed to send test';
            }
        }

        loadTournaments();
        loadPlayerGroups();
    </script>

    <footer class="site-footer">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se">support@bmkkomet.se</a></p>
    </footer>
<script src="/static/devbar.js"></script>
</body>
</html>
