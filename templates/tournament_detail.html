<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Detail</title>
    <link rel="stylesheet" href="/static/design-system.css">
</head>
<body>
    <div class="page">
    <a href="/results.html" class="back-link" style="display:inline-block;margin-bottom:var(--sp-3)">Back to Results</a>
    <h1 id="tournament-name" class="page-title">Loading...</h1>
    <p id="tournament-info" class="muted"></p>

    <!-- Overview Stats -->
    <h2 class="card-title" style="margin:var(--sp-5) 0 var(--sp-3)">Tournament Overview</h2>
    <div id="overview-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-3)">
        <div class="inset" style="text-align:center">
            <div class="stat-value" id="stat-total-players">-</div>
            <div class="label">Players</div>
        </div>
        <div class="inset" style="text-align:center">
            <div class="stat-value" id="stat-total-clubs">-</div>
            <div class="label">Clubs</div>
        </div>
    </div>

    <!-- Club Table (all clubs with player count) -->
    <div id="club-table-section">
        <h2 class="card-title" style="margin:var(--sp-5) 0 var(--sp-3)">Clubs</h2>
        <table class="table table--stack" id="club-table"></table>
    </div>

    <!-- Club Detail (shown when club selected) -->
    <div id="club-detail" style="display:none;">
        <a href="#" class="back-link" style="display:inline-block;margin-bottom:var(--sp-3)" onclick="hideClubDetail(); return false;">Back to all clubs</a>
        <h2 class="page-title" id="club-detail-title"></h2>
        <h3 class="card-title" style="margin:var(--sp-4) 0 var(--sp-3)">Club Stats</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-3)">
            <div class="inset" style="text-align:center">
                <div class="stat-value" id="stat-club-players">0</div>
                <div class="label">Players</div>
            </div>
            <div class="inset" style="text-align:center;cursor:pointer" onclick="showMedalWinners('1')">
                <div class="stat-value" id="stat-gold">0</div>
                <div class="label">Gold</div>
            </div>
            <div class="inset" style="text-align:center;cursor:pointer" onclick="showMedalWinners('2')">
                <div class="stat-value" id="stat-silver">0</div>
                <div class="label">Silver</div>
            </div>
            <div class="inset" style="text-align:center;cursor:pointer" onclick="showMedalWinners('3')">
                <div class="stat-value" id="stat-bronze">0</div>
                <div class="label">Bronze</div>
            </div>
        </div>
        <div id="medal-winners" class="inset" style="display:none;margin:var(--sp-3) 0">
            <h4 id="medal-winners-title" style="margin:0 0 var(--sp-2)"></h4>
            <div id="medal-winners-list"></div>
        </div>
        <h3 class="card-title" style="margin:var(--sp-4) 0 var(--sp-3)">Players</h3>
        <div id="club-players" class="card"></div>
    </div>

    <!-- Player Detail (shown when player selected) -->
    <div id="player-detail" style="display:none;">
        <a href="#" class="back-link" style="display:inline-block;margin-bottom:var(--sp-3)" onclick="hidePlayerDetail(); return false;">Back to club</a>
        <h2 class="page-title" id="player-name"></h2>
        <table class="table table--stack" id="player-stats"></table>
        <h3 class="card-title" style="margin:var(--sp-5) 0 var(--sp-3)">Matches</h3>
        <div id="player-matches"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tournamentId = params.get('id');
        document.getElementById('tournament-name').textContent = decodeURIComponent(params.get('name') || '');
        document.getElementById('tournament-info').textContent = decodeURIComponent(params.get('info') || '');
        document.title = decodeURIComponent(params.get('name') || 'Tournament');

        let allPlayers = [];
        let allMedals = [];

        async function loadData() {
            const [pRes, mRes] = await Promise.all([
                fetch(`/api/tournament-clubs?id=${tournamentId}`),
                fetch(`/api/tournament-medals?id=${tournamentId}`)
            ]);
            const pData = await pRes.json();
            const mData = await mRes.json();
            if (pData.success) allPlayers = pData.players;
            if (mData.success) allMedals = mData.medals;

            const clubs = [...new Set(allPlayers.map(p => p.club).filter(Boolean))].sort();

            // Overview stats
            document.getElementById('stat-total-players').textContent = allPlayers.length;
            document.getElementById('stat-total-clubs').textContent = clubs.length;

            // Club table
            document.getElementById('club-table').innerHTML =
                '<thead><tr><th>Club</th><th>Players</th><th>Gold</th><th>Silver</th><th>Bronze</th></tr></thead><tbody>' +
                clubs.map(c => {
                    const count = allPlayers.filter(p => p.club === c).length;
                    const clubMedals = getMedalsForClub(c);
                    return `<tr onclick="selectClub('${c.replace(/'/g,"\\'")}')">
                        <td data-label="Club">${c}</td><td data-label="Players">${count}</td>
                        <td data-label="Gold">${clubMedals.gold}</td><td data-label="Silver">${clubMedals.silver}</td><td data-label="Bronze">${clubMedals.bronze}</td>
                    </tr>`;
                }).join('') + '</tbody>';
        }

        function getMedalsForClub(club) {
            const clubPlayerNames = allPlayers.filter(p => p.club === club).map(p => normalizeName(p.name));
            const clubMedals = allMedals.filter(m => clubPlayerNames.includes(normalizeName(m.name)));
            return {
                gold: clubMedals.filter(m => m.placement === '1').length,
                silver: clubMedals.filter(m => m.placement === '2').length,
                bronze: clubMedals.filter(m => m.placement.startsWith('3')).length
            };
        }

        // Normalize "Lastname, Firstname" and "Firstname Lastname" to same format for comparison
        function normalizeName(name) {
            if (name.includes(',')) {
                const parts = name.split(',').map(s => s.trim());
                return (parts[1] + ' ' + parts[0]).toLowerCase().trim();
            }
            return name.toLowerCase().trim();
        }

        function selectClub(club) {
            currentClub = club;
            document.getElementById('club-table-section').style.display = 'none';
            document.getElementById('overview-stats').style.display = 'none';
            document.getElementById('club-detail').style.display = '';
            document.getElementById('club-detail-title').textContent = club;
            document.getElementById('medal-winners').style.display = 'none';

            const players = allPlayers.filter(p => p.club === club);
            const medals = getMedalsForClub(club);

            document.getElementById('stat-club-players').textContent = players.length;
            document.getElementById('stat-gold').textContent = medals.gold;
            document.getElementById('stat-silver').textContent = medals.silver;
            document.getElementById('stat-bronze').textContent = medals.bronze;

            document.getElementById('club-players').innerHTML = players.map(p => {
                const playerMedals = allMedals.filter(m => normalizeName(m.name) === normalizeName(p.name));
                const badges = playerMedals.map(m => {
                    const cls = m.placement === '1' ? 'badge--ok' : m.placement === '2' ? 'badge--warn' : 'badge--neutral';
                    const label = m.placement === '1' ? 'Gold' : m.placement === '2' ? 'Silver' : 'Bronze';
                    return `<span class="badge ${cls}">${label} &middot; ${m.event}</span>`;
                }).join('');
                return `<div class="card__row" style="display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);flex-wrap:wrap;cursor:pointer" onclick="showPlayer('${p.player_id || ''}', '${p.name.replace(/'/g,"\\'")}')">
                    <span>${p.name}</span>
                    <div>${badges}</div>
                </div>`;
            }).join('');
        }

        function hideClubDetail() {
            document.getElementById('club-detail').style.display = 'none';
            document.getElementById('club-table-section').style.display = '';
            document.getElementById('overview-stats').style.display = 'grid';
        }

        let currentClub = '';

        function showMedalWinners(placement) {
            const label = placement === '1' ? 'Gold' : placement === '2' ? 'Silver' : 'Bronze';
            const clubPlayerNames = allPlayers.filter(p => p.club === currentClub).map(p => normalizeName(p.name));
            const winners = allMedals.filter(m => {
                const matchPlacement = placement === '3' ? m.placement.startsWith('3') : m.placement === placement;
                return matchPlacement && clubPlayerNames.includes(normalizeName(m.name));
            });

            document.getElementById('medal-winners-title').textContent = `${label} Winners (${winners.length})`;
            document.getElementById('medal-winners-list').innerHTML = winners.map(w =>
                `<div style="padding:var(--sp-1) 0;">${w.name} — <em>${w.event}</em></div>`
            ).join('') || '<p class="muted">None</p>';
            document.getElementById('medal-winners').style.display = '';
        }

        async function showPlayer(playerId, name) {
            document.getElementById('club-detail').style.display = 'none';
            document.getElementById('overview-stats').style.display = 'none';
            document.getElementById('player-detail').style.display = '';
            document.getElementById('player-name').textContent = name;
            document.getElementById('player-stats').innerHTML = '<tr><td>Loading...</td></tr>';
            document.getElementById('player-matches').innerHTML = '';

            if (!playerId) {
                const res = await fetch(`/api/tournament-player-id?id=${tournamentId}&name=${encodeURIComponent(name)}`);
                const data = await res.json();
                playerId = data.player_id || '';
            }

            if (!playerId) {
                document.getElementById('player-stats').innerHTML = '<tr><td>Player details not available</td></tr>';
                return;
            }

            const res = await fetch(`/api/tournament-player-results?id=${tournamentId}&player=${playerId}`);
            const data = await res.json();
            if (!data.success) return;

            document.getElementById('player-stats').innerHTML =
                '<thead><tr><th>Category</th><th>Played</th><th>W-L</th><th>Sets</th><th>Points</th></tr></thead><tbody>' +
                data.stats.map(s => `<tr><td data-label="Category"><strong>${s.category}</strong></td><td data-label="Played">${s.played}</td><td data-label="W-L">${s.win_loss}</td><td data-label="Sets">${s.sets}</td><td data-label="Points">${s.points}</td></tr>`).join('') + '</tbody>';

            document.getElementById('player-matches').innerHTML = data.matches.map(m => `
                <div class="card">
                    <div class="card__body">
                        <div class="muted">${m.round} · ${m.event}</div>
                        <div class="stack">
                            <div>${m.team1} <span class="badge ${m.team1_won ? 'badge--ok' : 'badge--neutral'}">${m.team1_won ? 'Won' : 'Lost'}</span></div>
                            <div>${m.team2} <span class="badge ${!m.team1_won ? 'badge--ok' : 'badge--neutral'}">${!m.team1_won ? 'Won' : 'Lost'}</span></div>
                        </div>
                        ${m.score ? `<div style="font-weight:700;color:var(--blue);margin-top:var(--sp-2)">${m.score}</div>` : ''}
                    </div>
                </div>
            `).join('') || '<p class="muted">No match details available</p>';
        }

        function hidePlayerDetail() {
            document.getElementById('player-detail').style.display = 'none';
            document.getElementById('club-detail').style.display = '';
            document.getElementById('overview-stats').style.display = 'none';
        }

        loadData();
    </script>
    </div>

    <footer class="site-footer">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se">support@bmkkomet.se</a></p>
    </footer>
<script src="/static/devbar.js"></script>
</body>
</html>
