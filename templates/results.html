<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Results</title>
    <link rel="stylesheet" href="/static/design-system.css">
</head>
<body>
    <div class="page">
    <div class="topbar">
        <span id="admin-header-name" style="font-weight:600"></span>
        <button onclick="window.location.href='/'" class="btn btn--secondary">Logout</button>
    </div>
    <button type="button" class="btn btn--secondary admin-nav__toggle" aria-expanded="false" aria-controls="admin-nav" onclick="const n=this.nextElementSibling;const o=n.classList.toggle('is-open');this.setAttribute('aria-expanded',o)">Menu</button>
        <nav class="admin-nav" id="admin-nav">
        <a href="/">Tournaments for Registration</a>
        <a href="/add-remove-tournaments.html">Add/Remove</a>
        <a href="/results.html" class="is-active">Previous Tournaments</a>
        <a href="/send-email.html">Send Email</a>
        <a href="/manage.html">Manage</a>
    </nav>
    <script>
        fetch("/api/bwf-status").then(r=>r.json()).then(d=>{
            const el = document.getElementById("admin-header-name");
            if(el && d.logged_in) el.textContent = "Admin: " + d.player_name;
            if(!d.is_admin) window.location.href = "/";
        });
        document.querySelector('[onclick*="location"]').onclick = async () => {
            await fetch("/api/bwf-logout", {method:"POST"});
            window.location.href = "/";
        };
    </script>

    <h1 class="page-title">Tournament Results</h1>

    <div class="inset" style="margin-bottom:var(--sp-5)">
        <div style="display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap">
            <label for="quickFilter">Quick filter:</label>
            <select id="quickFilter" onchange="applyQuickFilter()">
                <option value="">Select period...</option>
                <option value="last_week">Last Week</option>
                <option value="this_week">This Week</option>
                <option value="next_week">Next Week</option>
                <option value="last_month">Last Month</option>
                <option value="this_month">This Month</option>
                <option value="next_month">Next Month</option>
            </select>
            <label for="startDate">From:</label>
            <input type="date" id="startDate">
            <label for="endDate">To:</label>
            <input type="date" id="endDate">
            <label for="statusFilter" class="sr-only">Status</label>
            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="4">Finished</option>
                <option value="2">Registration Open</option>
                <option value="3">Upcoming</option>
            </select>
            <button onclick="searchTournaments()" class="btn">Search</button>
        </div>
    </div>

    <p id="loading" class="muted" style="display:none;">Loading tournaments...</p>
    <div id="results" class="stack"></div>

    <script>
        function applyQuickFilter() {
            const filter = document.getElementById('quickFilter').value;
            const now = new Date();
            let start, end;

            switch(filter) {
                case 'last_week':
                    start = new Date(now); start.setDate(now.getDate() - now.getDay() - 7);
                    end = new Date(start); end.setDate(start.getDate() + 6);
                    break;
                case 'this_week':
                    start = new Date(now); start.setDate(now.getDate() - now.getDay());
                    end = new Date(start); end.setDate(start.getDate() + 6);
                    break;
                case 'next_week':
                    start = new Date(now); start.setDate(now.getDate() - now.getDay() + 7);
                    end = new Date(start); end.setDate(start.getDate() + 6);
                    break;
                case 'last_month':
                    start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    end = new Date(now.getFullYear(), now.getMonth(), 0);
                    break;
                case 'this_month':
                    start = new Date(now.getFullYear(), now.getMonth(), 1);
                    end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                    break;
                case 'next_month':
                    start = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                    end = new Date(now.getFullYear(), now.getMonth() + 2, 0);
                    break;
                default: return;
            }
            document.getElementById('startDate').value = start.toISOString().slice(0,10);
            document.getElementById('endDate').value = end.toISOString().slice(0,10);
            searchTournaments();
        }

        async function searchTournaments() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const status = document.getElementById('statusFilter').value;
            if (!start || !end) { alert('Select a date range'); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            const params = new URLSearchParams({start, end});
            if (status) params.append('status', status);

            const res = await fetch(`/api/search-tournaments?${params}`);
            const data = await res.json();
            document.getElementById('loading').style.display = 'none';

            if (!data.success || !data.tournaments.length) {
                document.getElementById('results').innerHTML = '<p class="muted">No tournaments found for this period.</p>';
                return;
            }

            document.getElementById('results').innerHTML = data.tournaments.map(t => {
                const detailUrl = `/tournament-detail.html?id=${t.id}&name=${encodeURIComponent(t.name)}&info=${encodeURIComponent(t.location + ' · ' + t.date_start + (t.date_end ? ' to ' + t.date_end : ''))}`;
                return `
                <a class="card" href="${detailUrl}" style="display:block">
                    <div class="card__body">
                        <h2 class="card-title">${t.name}</h2>
                        <div class="muted" style="margin-top:var(--sp-1)">Location: ${t.location}</div>
                        <div class="muted">Date: ${t.date_start}${t.date_end ? ' to ' + t.date_end : ''}</div>
                        <div class="muted">Status: ${t.status || ''}</div>
                    </div>
                </a>
            `}).join("");
        }

        // Default: this week
        document.getElementById('quickFilter').value = 'this_week';
        applyQuickFilter();
    </script>
    </div>

    <footer class="site-footer">
        <p>Behöver du hjälp? / Need support? <a href="mailto:support@bmkkomet.se">support@bmkkomet.se</a></p>
    </footer>
<script src="/static/devbar.js"></script>
</body>
</html>
