[pytest]
testpaths = .
# Without this, pytest's prepend import mode (the console-script default)
# puts <repo>/tests on sys.path instead of <repo> itself, and every
# `from tests.e2e import ...` in the e2e suite fails with
# ModuleNotFoundError: No module named 'tests'. `python -m pytest` masked
# this locally because it also prepends the cwd -- the console script does
# not. See tests/e2e/__init__.py (present) vs tests/__init__.py (absent).
pythonpath = .
markers =
    live: reaches the real Badminton Sweden site or needs a server already running. Deselected in CI with -m "not live", because CI is offline by design.
